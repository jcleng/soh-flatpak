name: Build Flatpak

# 创建 Release 需要写权限（默认 GITHUB_TOKEN 为只读）
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'com.harbourmasters.Shipwright.yaml'
      - 'soh-wrapper'
      - 'com.harbourmasters.Shipwright.desktop'
      - 'com.harbourmasters.Shipwright.metainfo.xml'
      - 'icons/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 Release'
        type: boolean
        required: false
        default: true

env:
  SOH_VERSION: "9.3.1"
  APP_ID: com.harbourmasters.Shipwright

jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      # 与清单中的 runtime org.freedesktop.Platform 25.08 对应
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.APP_ID }}.flatpak
          manifest-path: ${{ env.APP_ID }}.yaml
          cache-key: flatpak-builder-soh-${{ env.SOH_VERSION }}
          # 上游 AppImage 已含编译产物，缓存命中可显著加速
          repository-name: flathub
          branch: stable
          upload-artifact: false

      - name: Verify bundle
        run: |
          set -eu
          ls -lh "${APP_ID}.flatpak"
          echo "bundle size: $(stat -c %s "${APP_ID}.flatpak") bytes"
          # 校验 bundle 可被 flatpak 正确识别
          flatpak install --user --noninteractive --bundle "${APP_ID}.flatpak" || {
            echo "::error::bundle 安装校验失败"
            exit 1
          }
          flatpak list --app --columns=application,branch
          flatpak uninstall --user -y "${APP_ID}" || true

      - name: Compute checksum
        run: |
          set -eu
          sha256sum "${APP_ID}.flatpak" | tee sha256.txt
          SHA=$(sha256sum "${APP_ID}.flatpak" | awk '{print $1}')
          echo "SHA256_FULL=${SHA}  ${APP_ID}.flatpak" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          set -eu
          DATE=$(date +%Y%m%d)
          TAG=v${SOH_VERSION}-${DATE}
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Ship of Harkinian ${SOH_VERSION} Flatpak (${TAG})" >> "$GITHUB_ENV"
          {
            echo "# Ship of Harkinian (SoH) Flatpak"
            echo ""
            echo "> 非官方 Flatpak 封装，直接打包上游官方 AppImage Release，不做源码编译。"
            echo ""
            echo "## 安装方法"
            echo ""
            echo '```bash'
            echo "# 下载 ${APP_ID}.flatpak 后："
            echo "flatpak install --user ${APP_ID}.flatpak"
            echo "flatpak run ${APP_ID}"
            echo '```'
            echo ""
            echo "## 重要提示"
            echo ""
            echo "**本包不含任何版权游戏资源。** 你需要自备合法获得的《时之笛》ROM，首次启动时程序会提示导入。"
            echo ""
            echo "## 说明"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 应用 ID | \`${APP_ID}\` |"
            echo "| 上游版本 | Ship of Harkinian **${SOH_VERSION}** (Dewey Bravo) |"
            echo "| 运行时 | org.freedesktop.Platform 25.08 |"
            echo "| 构建来源 | 上游官方 AppImage 解包封装 |"
            echo ""
            echo "## 数据目录"
            echo ""
            echo '```'
            echo "~/.var/app/${APP_ID}/data   # 配置 / 存档 / Mods / ROM"
            echo '```'
            echo ""
            echo "## 文件校验 (SHA256)"
            echo '```'
            echo "${SHA256_FULL}"
            echo '```'
            echo ""
            echo "## 上游项目"
            echo ""
            echo "- 源码: https://github.com/HarbourMasters/Shipwright"
            echo "- 官网: https://shipofharkinian.com"
          } > release.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}-flatpak
          path: ${{ env.APP_ID }}.flatpak
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ github.workspace }}/release.txt
          files: ${{ github.workspace }}/${{ env.APP_ID }}.flatpak
          overwrite_files: true
